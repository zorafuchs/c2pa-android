# C2PA Native Library Version
# Update this to use a different release from https://github.com/contentauth/c2pa-rs/releases
c2paVersion=v0.91.4-mldsa.2
c2paRepo=zorafuchs/c2pa-rs

# Optional. Build against c2pa-<version>-<triple>.zip archives in this directory
# instead of downloading the release pinned above. Normally passed on the command
# line via `make library C2PA_ARCHIVE_DIR=<dir>`, not set here.
c2paArchiveDir=
